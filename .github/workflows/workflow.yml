name: Upstream Tag Check, Build, Tag & Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  check-upstream-latest-tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.compare.outputs.new_tag }}
      tag_name: ${{ steps.compare.outputs.tag_name }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest upstream tag
        id: get_latest_tag
        run: |
          latest_tag=$(git ls-remote --tags --sort='version:refname' \
            https://github.com/Ralim/IronOS.git \
            | awk '{print $2}' \
            | grep -v '\^{}' \
            | sed 's|refs/tags/||' \
            | tail -n1)
          
          if [ -z "$latest_tag" ]; then
            echo "::error::No upstream tag found"
            exit 1
          fi
          
          echo "Found upstream tag: $latest_tag"
          echo "$latest_tag" > latest_tag.txt
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Compare upstream tag with local and remote tags
        id: compare
        run: |
          latest_tag=$(cat latest_tag.txt)
          
          # Prüfen, ob Tag lokal existiert
          if git tag --list | grep -Fxq "$latest_tag"; then
            echo "::notice::Upstream tag $latest_tag exists locally. No new build needed."
            echo "new_tag=false" >> $GITHUB_OUTPUT
            echo "tag_name=$latest_tag" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Prüfen, ob Tag auf Remote (origin) existiert
          if git ls-remote --tags origin | grep -q "refs/tags/$latest_tag$"; then
            echo "::notice::Upstream tag $latest_tag exists on remote. No new build needed."
            echo "new_tag=false" >> $GITHUB_OUTPUT
            echo "tag_name=$latest_tag" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "::notice::Upstream tag $latest_tag is new. Build needed."
          echo "new_tag=true" >> $GITHUB_OUTPUT
          echo "tag_name=$latest_tag" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.manufacturer }} ${{ matrix.model }}
    needs: check-upstream-latest-tag
    if: needs.check-upstream-latest-tag.outputs.new_tag == 'true'
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - manufacturer: Miniware
            model: MHP30
            extension: hex
          - manufacturer: Miniware
            model: TS100
            extension: hex
          - manufacturer: Miniware
            model: TS80
            extension: hex
          - manufacturer: Miniware
            model: TS80P
            extension: hex
          - manufacturer: Pine64
            model: Pinecil
            extension: dfu
            suffix: _v1
          - manufacturer: Pine64
            model: Pinecilv2
            extension: bin
            suffix: _v2
            ws2812b: 1
          - manufacturer: Sequre
            model: S60
            extension: hex
          - manufacturer: Sequre
            model: S60P
            extension: hex
          - manufacturer: Sequre
            model: T55
            extension: hex
    
    steps:
      - name: Install dependencies (apk)
        run: |
          apk add --no-cache \
            gcc-riscv-none-elf g++-riscv-none-elf \
            gcc-arm-none-eabi g++-arm-none-eabi \
            newlib-riscv-none-elf newlib-arm-none-eabi \
            findutils python3 py3-pip python3-dev \
            make git bash sudo build-base musl-dev libc-dev \
            zip unzip docker docker-compose
      
      - name: Start Docker daemon
        run: |
          # Starte Docker daemon im Hintergrund
          dockerd > /var/log/dockerd.log 2>&1 &
          
          # Warte bis Docker bereit ist
          echo "Waiting for Docker daemon to start..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon is ready!"
              docker info
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          if ! docker info >/dev/null 2>&1; then
            echo "ERROR: Docker daemon failed to start"
            cat /var/log/dockerd.log
            exit 1
          fi

      - name: Set up Python venv and install bdflib
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir bdflib

      - name: Clone Upstream IronOS at tag
        env:
          TAG_NAME: ${{ needs.check-upstream-latest-tag.outputs.tag_name }}
        run: |
          echo "::group::Cloning IronOS tag: $TAG_NAME"
          git clone --depth 1 --branch "$TAG_NAME" \
            https://github.com/Ralim/IronOS.git IronOS
          cd IronOS
          git submodule update --init --recursive --depth 1
          echo "::endgroup::"

      - name: Prepare toolchains (deploy.sh)
        run: |
          cd IronOS/scripts
          sudo sh deploy.sh

      - name: Build Multifirmware ${{ matrix.manufacturer }} ${{ matrix.model }}
        run: |
          . /tmp/venv/bin/activate
          cd IronOS/source
          
          echo "::group::Building ${{ matrix.model }}"
          
          if [ "${{ matrix.ws2812b }}" = "1" ]; then
            make -j$(nproc) \
              model=${{ matrix.model }} \
              custom_multi_langs="DE EN" \
              ws2812b_enable=1 \
              firmware-multi_compressed_Custom
          else
            make -j$(nproc) \
              model=${{ matrix.model }} \
              custom_multi_langs="DE EN" \
              firmware-multi_compressed_Custom
          fi
          
          echo "::endgroup::"

      - name: Rename firmware file
        run: |
          cd IronOS/source/Hexfile
          TAG_NAME="${{ needs.check-upstream-latest-tag.outputs.tag_name }}"
          MODEL="${{ matrix.model }}"
          EXT="${{ matrix.extension }}"
          SUFFIX="${{ matrix.suffix }}"
          
          OLD_FILE="${MODEL}_multi_compressed_Custom.${EXT}"
          NEW_FILE="IronOS_${TAG_NAME}_${MODEL}${SUFFIX}-DE_EN.${EXT}"
          
          if [ ! -f "$OLD_FILE" ]; then
            echo "::error::Build output file not found: $OLD_FILE"
            ls -lah
            exit 1
          fi
          
          mv "$OLD_FILE" "$NEW_FILE"
          echo "Renamed: $OLD_FILE -> $NEW_FILE"

      - name: Generate SHA256 checksum
        run: |
          cd IronOS/source/Hexfile
          TAG_NAME="${{ needs.check-upstream-latest-tag.outputs.tag_name }}"
          MODEL="${{ matrix.model }}"
          EXT="${{ matrix.extension }}"
          SUFFIX="${{ matrix.suffix }}"
          
          FW_FILE="IronOS_${TAG_NAME}_${MODEL}${SUFFIX}-DE_EN.${EXT}"
          
          if [ ! -f "$FW_FILE" ]; then
            echo "::error::Firmware file not found: $FW_FILE"
            ls -lah
            exit 1
          fi
          
          sha256sum "$FW_FILE" > "${FW_FILE}.sha256"
          echo "::notice::SHA256: $(cat ${FW_FILE}.sha256)"

      - name: Create zip package
        run: |
          cd IronOS/source/Hexfile
          TAG_NAME="${{ needs.check-upstream-latest-tag.outputs.tag_name }}"
          MANUFACTURER="${{ matrix.manufacturer }}"
          MODEL="${{ matrix.model }}"
          EXT="${{ matrix.extension }}"
          SUFFIX="${{ matrix.suffix }}"
          
          FW_FILE="IronOS_${TAG_NAME}_${MODEL}${SUFFIX}-DE_EN.${EXT}"
          ZIP_NAME="IronOS_${TAG_NAME}_${MANUFACTURER}_${MODEL}-DE_EN.zip"
          
          if [ ! -f "$FW_FILE" ]; then
            echo "::error::Firmware file not found for packaging: $FW_FILE"
            exit 1
          fi
          
          zip "$ZIP_NAME" "$FW_FILE" "${FW_FILE}.sha256"
          mv "$ZIP_NAME" "$GITHUB_WORKSPACE/"
          
          echo "::notice::Created package: $ZIP_NAME"

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.manufacturer }}_${{ matrix.model }}_zip
          path: IronOS_*_*_*-DE_EN.zip
          retention-days: 30
          if-no-files-found: error

  verify-builds:
    name: Verify all builds completed
    needs: [check-upstream-latest-tag, build]
    if: needs.check-upstream-latest-tag.outputs.new_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify artifact count
        run: |
          EXPECTED_COUNT=9
          ACTUAL_COUNT=$(find artifacts -type f -name 'IronOS_*_*_*-DE_EN.zip' | wc -l)
          
          echo "Expected builds: $EXPECTED_COUNT"
          echo "Actual builds: $ACTUAL_COUNT"
          
          if [ "$ACTUAL_COUNT" -ne "$EXPECTED_COUNT" ]; then
            echo "::error::Build count mismatch! Expected $EXPECTED_COUNT, got $ACTUAL_COUNT"
            find artifacts -type f -name '*.zip'
            exit 1
          fi
          
          echo "::notice::All builds completed successfully"

  create-tag-and-release:
    needs: [check-upstream-latest-tag, build, verify-builds]
    if: needs.check-upstream-latest-tag.outputs.new_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all zip artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move firmware zip files to workspace
        run: |
          find artifacts -type f -name 'IronOS_*_*_*-DE_EN.zip' -exec mv {} . \;
          echo "::group::Release files"
          ls -lh IronOS_*.zip
          echo "::endgroup::"

      - name: Set up Git user
        run: |
          git config --global user.name "Steven Seifried"
          git config --global user.email "gitlab@canox.net"

      - name: Import GPG key and configure signing
        env:
          GPGKEY: ${{ secrets.GPGKEY }}
        run: |
          echo "$GPGKEY" | base64 --decode | gpg --batch --import
          
          KEYID=$(gpg --list-secret-keys --with-colons | grep '^sec' | cut -d: -f5 | head -n1)
          
          if [ -z "$KEYID" ]; then
            echo "::error::No GPG key found after import"
            exit 1
          fi
          
          echo "::notice::Using GPG Key: $KEYID"
          git config --global user.signingkey "$KEYID"
          git config --global gpg.program gpg
          git config --global tag.gpgSign true
          export GPG_TTY=$(tty)

      - name: Create signed tag
        run: |
          TAG="${{ needs.check-upstream-latest-tag.outputs.tag_name }}"
          
          # Prüfe, ob Tag auf Remote existiert
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "::notice::Tag $TAG exists on remote, skipping creation"
          else
            git tag -s "$TAG" -m "Upstream release $TAG"
            git push origin "$TAG"
            echo "::notice::Signed tag $TAG created and pushed"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-upstream-latest-tag.outputs.tag_name }}
          name: IronOS ${{ needs.check-upstream-latest-tag.outputs.tag_name }}
          body: |
            ## Automatic Release for IronOS ${{ needs.check-upstream-latest-tag.outputs.tag_name }}
            
            This is an automated build of IronOS firmware with DE/EN language support.
            
            ### Supported Devices
            - **Miniware**: MHP30, TS100, TS80, TS80P
            - **Pine64**: Pinecil v1, Pinecil v2
            - **Sequre**: S60, S60P, T55
            
            ### Installation
            1. Download the ZIP file for your device
            2. Verify the SHA256 checksum
            3. Flash the firmware according to your device's instructions
            
            ### Changelog
            For detailed changelog, see the [upstream release](https://github.com/Ralim/IronOS/releases/tag/${{ needs.check-upstream-latest-tag.outputs.tag_name }})
          prerelease: ${{ contains(needs.check-upstream-latest-tag.outputs.tag_name, 'rc') || contains(needs.check-upstream-latest-tag.outputs.tag_name, 'beta') }}
          files: IronOS_*_*_*-DE_EN.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
